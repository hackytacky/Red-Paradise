[project]
name = "g9-backend"
version = "0.1.0"
description = "G9 SPECTRE backend scaffold: trusted control-plane contracts (g9-core, g9-policy, g9-executor) as a FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g9_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
